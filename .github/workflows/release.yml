name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release --nologo

      - name: Test
        run: dotnet test -c Release --nologo --no-build

      - name: Publish
        run: dotnet publish src/EsMcp -c Release -o out/es-mcp --nologo

      - name: Zip
        run: Compress-Archive -Path out/es-mcp/* -DestinationPath es-mcp-win-x64.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: es-mcp-win-x64.zip
          generate_release_notes: true
