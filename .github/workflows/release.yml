name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release --nologo

      - name: Test
        run: dotnet test -c Release --nologo --no-build

      # Small download for machines that already have the .NET 10 runtime.
      # No pdb or xml docs in release zips; they are noise for an end user.
      - name: Publish (framework-dependent)
        run: dotnet publish src/EsMcp -c Release -o out/es-mcp --nologo -p:DebugType=none -p:DebugSymbols=false -p:GenerateDocumentationFile=false

      # Big download that runs anywhere: no .NET runtime needed. The default install path.
      - name: Publish (self-contained)
        run: dotnet publish src/EsMcp -c Release -o out/es-mcp-selfcontained --nologo -p:SelfContained=true -p:DebugType=none -p:DebugSymbols=false -p:GenerateDocumentationFile=false

      - name: Check the SDK DLL ships in both builds
        run: |
          foreach ($dir in @('out/es-mcp', 'out/es-mcp-selfcontained')) {
            if (-not (Test-Path "$dir/Everything64.dll")) { throw "$dir is missing Everything64.dll" }
          }

      # One-click install for Claude Desktop and other MCPB-aware apps. Reuses the self-contained
      # publish above, so the bundle needs no .NET runtime on the user's machine.
      - name: Build the MCP bundle
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            $version = (Select-String -Path Directory.Build.props -Pattern '<Version>([^<]+)</Version>').Matches[0].Groups[1].Value
          }
          Write-Host "Bundle version: $version"
          ./tools/mcpb.ps1 -Version $version -SourceDir out/es-mcp-selfcontained

      - name: Zip
        run: |
          Compress-Archive -Path out/es-mcp/* -DestinationPath es-mcp-win-x64.zip
          Compress-Archive -Path out/es-mcp-selfcontained/* -DestinationPath es-mcp-win-x64-selfcontained.zip
          Copy-Item out/mcpb/*.mcpb .

      # winget manifests need the sha256 of the self-contained zip, so publish it next to the assets.
      - name: Checksums
        run: |
          $lines = Get-ChildItem *.zip, *.mcpb | ForEach-Object {
            $hash = (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -Path SHA256SUMS.txt -Encoding ascii
          $lines

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            es-mcp-win-x64.zip
            es-mcp-win-x64-selfcontained.zip
            es-mcp-*.mcpb
            SHA256SUMS.txt
          generate_release_notes: true
